# The distro packages (build/linux/{deb,rpm,flatpak,aur}): each is built from the
# linux-appimage run's one-dir build and installed, started and removed in a clean
# container. The metadata tests also run on every push that touches the recipes.
name: linux-packages

on:
  workflow_run:
    workflows: [linux-appimage]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "build/linux/deb/**"
      - "build/linux/rpm/**"
      - "build/linux/flatpak/**"
      - "build/linux/aur/**"
      - ".github/workflows/linux-packages.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "linux-appimage run whose build to package"
        required: true

permissions:
  contents: read
  actions: read

env:
  CI_VERSION: "1.0.0"
  BUILD_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install pytest pytest-timeout pyyaml
      - run: python -m pytest build/linux/deb build/linux/rpm build/linux/flatpak build/linux/aur -q -p no:cacheprovider

  deb:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, image: "ubuntu:22.04" }
          - { runner: ubuntu-24.04, arch: x86_64, image: "ubuntu:24.04" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, image: "ubuntu:24.04" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uefn-ducky-linux-${{ matrix.arch }}
          path: artifact
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: bash build/linux/deb/ci_test.sh "$CI_VERSION" artifact/uefn-ducky.tar

  rpm:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    container: "fedora:41"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uefn-ducky-linux-x86_64
          path: artifact
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: bash build/linux/rpm/ci_test.sh "$CI_VERSION" artifact/uefn-ducky.tar

  flatpak:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uefn-ducky-linux-x86_64
          path: artifact
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: bash build/linux/flatpak/ci_test.sh "$CI_VERSION" artifact/uefn-ducky.tar dist
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-ducky-flatpak-x86_64
          path: dist/*.flatpak
          retention-days: 7

  aur:
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    container: "archlinux:base-devel"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uefn-ducky-appimage-x86_64
          path: artifact
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - run: bash build/linux/aur/ci_test.sh "$(find artifact -name 'UEFN-Ducky-*-x86_64.AppImage' | head -n1)"
