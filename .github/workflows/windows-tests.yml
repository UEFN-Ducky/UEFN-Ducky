# The full Windows suite on every push to main: a change that breaks Windows shows up
# within minutes, not at release time. pytest (ducky_app, the golden files included) and
# the panel's vitest. The summary compares the pass count with today's baseline.
name: windows-tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Passed on main the day this job was added (1.2.516, a local Windows run). Raise it
  # when tests are added; a run below it lost tests somewhere.
  BASELINE_PASSED: "7493"
  # "1" from the full test pass (2.1): test_platform_parity.py then fails instead of xfails.
  DUCKY_PARITY_STRICT: "0"
  PYTHONUTF8: "1"

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ducky_app/frontend/ui_web/web/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix ducky_app/frontend/ui_web/web

      # A busy runner made one timing-bound test of ~7,770 miss its limit on most runs (a
      # different one each time). Only the tests that failed run once more, alone; one that
      # fails again fails the job, one that passes is listed as FLAKY in the summary (still
      # a bug to fix). A run that recorded no failure (a crash) reruns nothing and fails.
      - name: pytest
        id: pytest
        continue-on-error: true
        run: python -m pytest ducky_app -q -n auto --junitxml="${{ runner.temp }}/pytest.xml"

      - name: pytest (failed tests, once more, alone)
        id: pytest_rerun
        if: ${{ !cancelled() && steps.pytest.outcome == 'failure' }}
        continue-on-error: true
        run: python -m pytest ducky_app -q --last-failed --last-failed-no-failures none --junitxml="${{ runner.temp }}/pytest-rerun.xml"

      - name: pytest gate
        if: ${{ !cancelled() && steps.pytest.outcome == 'failure' && steps.pytest_rerun.outcome != 'success' }}
        run: exit 1

      # Repo-root tests/ (release workflow guards, build drift) and release/ run in no other job.
      - name: pytest tests release
        id: pytest_root
        if: ${{ !cancelled() }}
        run: python -m pytest tests release -q

      # The Verse grammar and theme come from the person's own UEFN install (Epic's files,
      # never in the repo; scripts/ensure-verse-assets.mjs). CI has no UEFN: the editor's
      # imports get empty stand-ins of the same shape.
      - name: Verse language stand-ins
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import json
          from pathlib import Path

          stand_ins = {
              "verse.tmGrammar.json": {"scopeName": "source.verse", "patterns": [], "repository": {}},
              "language-configuration.json": {},
              "verse-snippets.json": {},
              "verse-dark.tmTheme.json": {"name": "Verse Dark", "type": "dark", "colors": {}, "tokenColors": []},
          }
          lang = Path("ducky_app/frontend/ui_web/web/src/verse-editor/lang")
          lang.mkdir(parents=True, exist_ok=True)
          for name, doc in stand_ins.items():
              if not (lang / name).is_file():
                  (lang / name).write_text(json.dumps(doc), encoding="utf-8")

      - name: vitest
        id: vitest
        if: ${{ !cancelled() }}
        working-directory: ducky_app/frontend/ui_web/web
        run: npm test

      - name: Summary
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def counts(xml):
              if not xml.is_file():
                  return None
              root = ET.parse(xml).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              total = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              return total - failed - skipped, failed, skipped

          def failed_names(xml):
              if not xml.is_file():
                  return set()
              return {f"{c.get('classname')}::{c.get('name')}" for c in ET.parse(xml).getroot().iter("testcase")
                      if c.find("failure") is not None or c.find("error") is not None}

          temp = Path(r"${{ runner.temp }}")
          baseline = int(os.environ["BASELINE_PASSED"])
          first = counts(temp / "pytest.xml")
          rerun = temp / "pytest-rerun.xml"
          lines = []
          if first is None:
              lines.append("windows-tests: pytest wrote no report")
          else:
              passed, failed, skipped = first
              lines.append(f"windows-tests: {passed:,} passed (baseline {baseline:,}), {failed:,} failed, {skipped:,} skipped")
              if passed + (counts(rerun) or (0,))[0] < baseline:
                  lines.append(f"**Fewer passing than the baseline ({baseline:,}).**")
          if rerun.is_file():
              flaky = sorted(failed_names(temp / "pytest.xml") - failed_names(rerun))
              still = sorted(failed_names(rerun))
              if flaky:
                  lines.append("**FLAKY** (failed under load, passed alone; fix them):\n" + "\n".join(f"- `{n}`" for n in flaky))
              if still:
                  lines.append("**Failed again alone:**\n" + "\n".join(f"- `{n}`" for n in still))
          lines.append("pytest: ${{ steps.pytest.outcome }} · rerun: ${{ steps.pytest_rerun.outcome }} · tests+release: ${{ steps.pytest_root.outcome }} · vitest: ${{ steps.vitest.outcome }}")
          text = "\n\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
