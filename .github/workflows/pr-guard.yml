# Fork-safe PR gate. No secrets, no publish, no artifacts.
# Style (default Ruff) is not a gate — plugin code is not Ruff-formatted.
# Pytest is best-effort: many tests import the desktop app host, which is
# not in a standalone plugin clone.
name: PR guard

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-guard-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks detect --source . --verbose --redact

  hidden-chars:
    name: hidden-chars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fail on invisible / bidi / tag Unicode
        run: |
          python - <<'PY'
          from pathlib import Path
          import unicodedata

          skip_dirs = {".git", "__pycache__", ".pytest_cache", ".ruff_cache", "deploy", "node_modules"}
          skip_suffix = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".zip", ".pyc", ".woff", ".woff2"}
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() in skip_suffix:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for i, ch in enumerate(text):
                  name = unicodedata.name(ch, "")
                  cat = unicodedata.category(ch)
                  bad = (
                      (cat.startswith("C") and ch not in "\n\r\t")
                      or any(
                          key in name
                          for key in (
                              "ZERO WIDTH",
                              "INVISIBLE",
                              "DIRECTION",
                              "OVERRIDE",
                              "BYTE ORDER",
                              "SOFT HYPHEN",
                              "TAG ",
                          )
                      )
                  )
                  if bad:
                      line = text.count("\n", 0, i) + 1
                      hits.append(f"{path}:{line} U+{ord(ch):04X} {name or cat}")
          if hits:
              print("\n".join(hits[:50]))
              raise SystemExit(f"hidden/bidi characters: {len(hits)}")
          print("hidden-chars: clean")
          PY

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Pytest (plugin packages only; non-blocking)
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          if not Path("plugin.json").is_file():
              print("tests: no plugin.json, skip")
              raise SystemExit(0)

          roots = [p for p in (Path("backend"), Path("scripts"), Path("tests")) if p.is_dir()]
          test_files = [
              path
              for root in roots
              for path in (*root.rglob("test_*.py"), *root.rglob("*_test.py"))
          ]
          if not test_files:
              print("pytest: no test files, skip")
              raise SystemExit(0)

          rc = subprocess.call(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "-q",
                  "--import-mode=importlib",
                  *[str(p) for p in test_files],
              ]
          )
          if rc:
              print("pytest: non-blocking on standalone plugin PRs")
          raise SystemExit(0)
          PY
