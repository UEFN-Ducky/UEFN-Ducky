# The Linux build: PyInstaller freeze on ubuntu-22.04 (glibc 2.35) for x86_64 and arm64,
# its runtime smoke under xvfb (imports, MCP, the bundled panel), then the AppImage.
# Output (used by the .deb/.rpm/Flatpak jobs and the release lane):
#   artifact uefn-ducky-linux-<arch>: dist/uefn-ducky.tar (the one-dir build)
name: linux-appimage

on:
  push:
    branches: [main]
    paths:
      - "build/unified.spec"
      - "build/build_exes.py"
      - "build/linux/**"
      - "release/sign_linux.py"
      - "native_launcher/**"
      - "requirements.txt"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ducky_app/frontend/ui_web/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native_launcher }
      - name: System packages
        run: |
          sudo apt-get update
          # ripgrep: the panel's prebuild (scripts/check-shipped-ui.mjs) greps with rg.
          sudo apt-get install -y libgtk-3-dev libportaudio2 xvfb ripgrep
          # PyGObject builds from source; the freeze bundles its typelibs (build_exes.LINUX_BUILD_APT).
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libxss1
      - name: Panel dependencies
        run: npm ci --prefix ducky_app/frontend/ui_web/web
      # build/ and release/ sit outside pytest's testpaths: run the packaging tests here.
      - name: Packaging tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider build/test_build_exes.py build/linux/appimage $(ls release/test_sign_linux.py 2>/dev/null)
      # CI has no UEFN: the Verse editor's grammar imports get empty stand-ins (as in linux-tests).
      # The release lane extracts the real ones (scripts/extract_vscode_ext.py) before its build.
      - name: Verse language stand-ins
        shell: python
        run: |
          import json
          from pathlib import Path

          stand_ins = {
              "verse.tmGrammar.json": {"scopeName": "source.verse", "patterns": [], "repository": {}},
              "language-configuration.json": {},
              "verse-snippets.json": {},
              "verse-dark.tmTheme.json": {"name": "Verse Dark", "type": "dark", "colors": {}, "tokenColors": []},
          }
          lang = Path("ducky_app/frontend/ui_web/web/src/verse-editor/lang")
          lang.mkdir(parents=True, exist_ok=True)
          for name, doc in stand_ins.items():
              if not (lang / name).is_file():
                  (lang / name).write_text(json.dumps(doc), encoding="utf-8")
      # build_exes.py runs the frozen app's --runtime-smoke itself (panel archive and
      # every asset verified, MCP server answers); xvfb gives it a display.
      - name: Freeze (PyInstaller) + runtime smoke
        run: xvfb-run -a python build/build_exes.py --no-bump
      - name: Starts under xvfb
        run: |
          xvfb-run -a dist/uefn-ducky/uefn-ducky --runtime-smoke "$RUNNER_TEMP/smoke.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['ok'] and r['panel']['all_assets_verified'] and r['window'], r; print(r['window'])" "$RUNNER_TEMP/smoke.json"
      - name: Pack the build folder
        run: tar -C dist -cf dist/uefn-ducky.tar uefn-ducky
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-ducky-linux-${{ matrix.arch }}
          path: dist/uefn-ducky.tar
          retention-days: 7
      - name: AppImage (zsync update info)
        run: |
          sudo apt-get install -y zsync
          python build/linux/appimage/build_appimage.py --arch ${{ matrix.arch }}
          ls -la dist/*.AppImage dist/*.zsync
      # Keys only from repository secrets (release/sign_linux.py reads the environment).
      - name: Sign (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::notice::no MINISIGN_SECRET_KEY secret: unsigned CI build"; exit 0; fi
          python release/sign_linux.py dist/UEFN-Ducky-*-${{ matrix.arch }}.AppImage dist/UEFN-Ducky-*-${{ matrix.arch }}.AppImage.zsync
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-ducky-appimage-${{ matrix.arch }}
          path: |
            dist/UEFN-Ducky-*-${{ matrix.arch }}.AppImage
            dist/UEFN-Ducky-*-${{ matrix.arch }}.AppImage.zsync
            dist/UEFN-Ducky-*-${{ matrix.arch }}.AppImage*.minisig
          retention-days: 7

  # Clean distros: nothing but a virtual display is installed before the AppImage starts.
  containers:
    name: start on ${{ matrix.image }} (${{ matrix.arch }}, ${{ matrix.mode }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["ubuntu:22.04", "ubuntu:24.04", "fedora:41", "archlinux:latest"]
        mode: [extract]
        exclude:
          - arch: aarch64
            image: "archlinux:latest" # no official arm64 image
        # Mounted through FUSE like a desktop start: the static runtime, no libfuse2 installed.
        include:
          - { arch: x86_64, image: "ubuntu:24.04", mode: fuse }
          - { arch: aarch64, image: "ubuntu:24.04", mode: fuse }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: uefn-ducky-appimage-${{ matrix.arch }}
          path: out
      - name: Start the AppImage
        run: |
          app="$(ls out/UEFN-Ducky-*-${{ matrix.arch }}.AppImage)"
          want="$(python3 -c "import sys; sys.path.insert(0, 'build/linux/appimage'); import build_appimage as b; print(b.update_info('${{ matrix.arch }}'))")"
          fuse=()
          [ "${{ matrix.mode }}" = fuse ] && fuse=(--device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined)
          docker run --rm "${fuse[@]}" -v "$PWD:/w" -w /w "${{ matrix.image }}" \
            bash build/linux/appimage/smoke_container.sh "/w/$app" "$want" "${{ matrix.mode }}"
