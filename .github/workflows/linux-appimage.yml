# The Linux build: PyInstaller freeze on ubuntu-22.04 (glibc 2.35) for x86_64 and arm64,
# its runtime smoke under xvfb (imports, MCP, the bundled panel), then the AppImage.
# Output (used by the .deb/.rpm/Flatpak jobs and the release lane):
#   artifact uefn-ducky-linux-<arch>: dist/uefn-ducky.tar (the one-dir build)
name: linux-appimage

on:
  push:
    branches: [main]
    paths:
      - "build/unified.spec"
      - "build/build_exes.py"
      - "build/linux/**"
      - "release/sign_linux.py"
      - "native_launcher/**"
      - "requirements.txt"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ducky_app/frontend/ui_web/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native_launcher }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libportaudio2 xvfb
      - name: Panel dependencies
        run: npm ci --prefix ducky_app/frontend/ui_web/web
      # build_exes.py runs the frozen app's --runtime-smoke itself (panel archive and
      # every asset verified, MCP server answers); xvfb gives it a display.
      - name: Freeze (PyInstaller) + runtime smoke
        run: xvfb-run -a python build/build_exes.py --no-bump
      - name: Starts under xvfb
        run: |
          xvfb-run -a dist/uefn-ducky/uefn-ducky --runtime-smoke "$RUNNER_TEMP/smoke.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['ok'] and r['panel']['all_assets_verified'], r" "$RUNNER_TEMP/smoke.json"
      - name: Pack the build folder
        run: tar -C dist -cf dist/uefn-ducky.tar uefn-ducky
      - uses: actions/upload-artifact@v4
        with:
          name: uefn-ducky-linux-${{ matrix.arch }}
          path: dist/uefn-ducky.tar
          retention-days: 7
