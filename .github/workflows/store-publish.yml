# Manual Store app publish (Setup.exe). Never on push / PR / cron.
# Open-source PRs never get DUCKYOS_API_KEY. Fork workflows cannot publish.
# No GitHub environment: runs never create deployment entries. DUCKYOS_API_KEY is
# a repository secret. Edits to this file need CODEOWNERS @UEFN-Ducky/admins review.
#
# Same release as a local one: the three release/publish_app.py steps
# (RELEASE_STEPS in that file) test, build + sign (app EXEs, Inno engine and its
# uninstaller, Ducky Setup host) and upload. Signing runs inside publish_app
# through release/sign_windows.py, with Azure Artifact Signing when the Azure
# secrets are set; without them the release is unsigned (plain Inno Setup).
#
# Linux ships in the same run: linux-build (ubuntu-22.04 x86_64 + arm64) freezes the
# app at the version the Windows build step will make, packs AppImage/.deb/.rpm/Flatpak
# and minisigns them; linux-repo builds the signed apt + dnf repos. The Windows job only
# starts once both pass, so a Linux failure stops the release before anything uploads;
# its upload step then registers Windows and Linux in one uds_app_release call.
# linux-bumps updates the AUR package and opens the Flathub PR after the release.
# dry_run=true builds everything and uploads nothing (bumps print their diffs).
# The app's "UEFN Ducky Release" workflow builds Windows on the PC and dispatches
# mode=linux-packages (set_version = its version) for the Linux side, then
# mode=linux-bumps (linux_run = that run) once the release is live.
name: Ducky Plugin Library Publish

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Store release notes (in-app toast); blank = from the commits"
        required: false
        default: ""
        type: string
      set_version:
        description: "Optional exact semver (else patch bump)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build every artifact, upload nothing"
        required: false
        default: false
        type: boolean
      channel:
        description: "beta = beta clients only; stable = everyone, plus the apt/dnf repo and AUR/Flathub"
        required: false
        default: beta
        type: choice
        options: [beta, stable]
      mode:
        description: "release = everything; linux-packages = only the Linux artifacts; linux-bumps = only AUR/Flathub"
        required: false
        default: release
        type: choice
        options: [release, linux-packages, linux-bumps]
      linux_run:
        description: "linux-bumps: the run whose linux-dist-* artifacts to use"
        required: false
        default: ""
        type: string

concurrency:
  group: store-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  linux-version:
    name: release version
    if: inputs.mode != 'linux-bumps'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: v
        env:
          DUCKYOS_BASE_URL: ${{ secrets.DUCKYOS_BASE_URL }}
          SET_VERSION: ${{ inputs.set_version }}
        run: |
          v="$(python -c "import sys; sys.path.insert(0, 'release'); import publish_app as p; p.print_next_version(sys.argv[1])" "${SET_VERSION}")"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

  linux-build:
    name: linux build (${{ matrix.arch }})
    needs: linux-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      VERSION: ${{ needs.linux-version.outputs.version }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      VERSE_LANG_ASSETS: ${{ secrets.VERSE_LANG_ASSETS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ducky_app/frontend/ui_web/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native_launcher }
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libportaudio2 xvfb zsync dpkg-dev \
            libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libxss1 \
            ripgrep  # the panel's prebuild (scripts/check-shipped-ui.mjs) greps with rg
      - name: Dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix ducky_app/frontend/ui_web/web
      # ponytail: build_exes.py always bumps patch, so it starts one below the release
      # version (x.y.0 starts at x.y.-1, which int() bumps to x.y.0).
      - name: Set the release version
        run: |
          python -c "import sys; sys.path.insert(0, 'release'); import publish_app as p; a, b, c = sys.argv[1].split('.'); p.write_version(f'{a}.{b}.{int(c) - 1}')" "$VERSION"
      # The Verse editor's grammar comes from Epic's UEFN install, which CI lacks and this
      # public repo can't hold: VERSE_LANG_ASSETS is base64 of a tar.gz of src/verse-editor/lang
      # (made on the release PC: tar -czf - -C <that folder> . | base64 -w0).
      - name: Verse language assets
        run: |
          lang=ducky_app/frontend/ui_web/web/src/verse-editor/lang
          mkdir -p "$lang"
          if [ -z "$VERSE_LANG_ASSETS" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "::notice::dry run without VERSE_LANG_ASSETS: empty Verse grammar stand-ins"
              echo '{"scopeName": "source.verse", "patterns": [], "repository": {}}' > "$lang/verse.tmGrammar.json"
              echo '{}' > "$lang/language-configuration.json"
              echo '{}' > "$lang/verse-snippets.json"
              echo '{"name": "Verse Dark", "type": "dark", "colors": {}, "tokenColors": []}' > "$lang/verse-dark.tmTheme.json"
              exit 0
            fi
            echo "VERSE_LANG_ASSETS is not set: a release never ships the Verse editor without its grammar"; exit 1
          fi
          printf '%s' "$VERSE_LANG_ASSETS" | base64 -d | tar -xzf - -C "$lang"
          ls -la "$lang"
      - name: Freeze (PyInstaller) + runtime smoke
        run: |
          xvfb-run -a python build/build_exes.py
          built="$(python -c "import sys; sys.path.insert(0, 'release'); import publish_app as p; print(p.read_version())")"
          [ "$built" = "$VERSION" ] || { echo "built $built, expected $VERSION"; exit 1; }
      - name: Packages
        run: |
          mkdir -p dist/linux
          tar -C dist -cf dist/uefn-ducky.tar uefn-ducky
          python build/linux/appimage/build_appimage.py --arch ${{ matrix.arch }}
          mv dist/UEFN-Ducky-"$VERSION"-${{ matrix.arch }}.AppImage dist/*.zsync dist/linux/
          bash build/linux/deb/build_deb.sh "$VERSION" ${{ matrix.deb }} dist/uefn-ducky dist/linux
          docker run --rm -v "$PWD:/w" -w /w fedora:41 bash -c \
            'dnf install -y rpm-build tar >/dev/null && bash build/linux/rpm/build_rpm.sh "$0" dist/uefn-ducky.tar dist/linux' "$VERSION"
          sudo chown -R "$(id -u):$(id -g)" dist/linux
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: linux-onedir-x86_64
          path: dist/uefn-ducky.tar
          if-no-files-found: error
          retention-days: 1
      - name: Sign (minisign)
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo "::notice::dry run without MINISIGN_SECRET_KEY: unsigned"; exit 0; fi
            echo "MINISIGN_SECRET_KEY is not set: a release never ships unsigned Linux files"; exit 1
          fi
          python release/sign_linux.py dist/linux/*"$VERSION"* dist/linux/*.zsync
      - name: Every package carries the release version
        run: |
          ls -la dist/linux
          for f in dist/linux/*.AppImage dist/linux/*.deb dist/linux/*.rpm; do
            case "$(basename "$f")" in *"$VERSION"*) ;; *) echo "$f is not $VERSION"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist-${{ matrix.arch }}
          path: dist/linux/
          if-no-files-found: error
          retention-days: 14

  # 22.04's flatpak-builder still runs appstream-compose, which the GNOME 50 SDK dropped;
  # 24.04's uses appstreamcli (as linux-packages.yml). Same one-dir build as the x86_64 job.
  linux-flatpak:
    name: linux flatpak (x86_64)
    needs: [linux-version, linux-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.linux-version.outputs.version }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: linux-onedir-x86_64
          path: dist
      - name: Flatpak
        run: bash build/linux/flatpak/ci_test.sh "$VERSION" dist/uefn-ducky.tar dist/linux
      - name: Sign (minisign)
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo "::notice::dry run without MINISIGN_SECRET_KEY: unsigned"; exit 0; fi
            echo "MINISIGN_SECRET_KEY is not set: a release never ships unsigned Linux files"; exit 1
          fi
          python -m pip install cryptography
          python release/sign_linux.py dist/linux/*"$VERSION"*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist-flatpak
          path: dist/linux/
          if-no-files-found: error
          retention-days: 14

  linux-repo:
    name: apt + dnf repos
    needs: [linux-version, linux-build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.linux-version.outputs.version }}
      LINUX_REPO_GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
      LINUX_REPO_GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-dist-*
          path: dist/linux
          merge-multiple: true
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg
          python -m pip install cryptography
      - name: Build and sign the repos
        run: |
          repo=dist/linux-repo
          mkdir -p "$repo"
          if [ -n "$LINUX_REPO_GPG_PRIVATE_KEY" ]; then
            export GNUPGHOME="$(mktemp -d)"
            printf '%s' "$LINUX_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
            # Armored: the site's install commands dearmor it; the Store takes no other root file.
            gpg --batch --armor --export > "$repo/uefn-ducky.gpg"
            unset GNUPGHOME
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry run without LINUX_REPO_GPG_PRIVATE_KEY: throwaway CI key"
            export DUCKY_REPO_SIGNER="bash $PWD/build/linux/deb/test_repo_signer.sh" GNUPGHOME="$RUNNER_TEMP/gnupg"
          else
            echo "LINUX_REPO_GPG_PRIVATE_KEY is not set: the apt/dnf repos must be signed"; exit 1
          fi
          bash build/linux/deb/build_apt_repo.sh "$repo/apt" dist/linux/*"$VERSION"*.deb
          bash build/linux/rpm/build_dnf_repo.sh "$repo/rpm" dist/linux/*"$VERSION"*.rpm
          cp build/linux/rpm/uefn-ducky.repo "$repo/rpm/"
          if [ -n "${DUCKY_REPO_SIGNER:-}" ]; then
            cp "$GNUPGHOME/repo.asc" "$repo/uefn-ducky.gpg"
          fi
          find "$repo" -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: linux-repo
          path: dist/linux-repo/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: build, sign and publish Setup
    needs: [linux-version, linux-build, linux-flatpak, linux-repo]
    if: inputs.mode == 'release'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DUCKYOS_API_KEY: ${{ secrets.DUCKYOS_API_KEY }}
      DUCKYOS_BASE_URL: ${{ secrets.DUCKYOS_BASE_URL }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Builds the Ducky Setup host; the Artifact Signing dlib runs on its runtime.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Python venv, panel packages and Inno Setup 6
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller
          (cd ducky_app/frontend/ui_web/web && npm ci --no-audit --no-fund)
          choco install innosetup --no-progress -y

      - name: Require Store API key
        shell: bash
        run: |
          if [ -z "${DUCKYOS_API_KEY}" ]; then
            echo "Missing DUCKYOS_API_KEY (repository secret)."
            exit 1
          fi
          if [ -z "${DUCKYOS_BASE_URL}" ]; then
            echo "DUCKYOS_BASE_URL=https://uefnducky.org" >> "$GITHUB_ENV"
          fi

      - name: Sign with Artifact Signing when its secrets are set
        shell: bash
        run: |
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_TENANT_ID}" ] \
            && [ -n "${AZURE_TRUSTED_SIGNING_ENDPOINT}" ] && [ -n "${AZURE_TRUSTED_SIGNING_ACCOUNT}" ] \
            && [ -n "${AZURE_CERT_PROFILE_NAME}" ]; then
            echo "DUCKY_SIGN_PROVIDER=azure" >> "$GITHUB_ENV"
            echo "DUCKY_AZURE_AUTH=cli" >> "$GITHUB_ENV"
            echo "Signing with Azure Artifact Signing."
          else
            echo "DUCKY_SIGN_PROVIDER=none" >> "$GITHUB_ENV"
            echo "Azure Artifact Signing secrets are not set: this release ships unsigned (plain Inno Setup)."
          fi

      # OIDC sign-in of the Azure CLI; the dlib signs as that identity (DUCKY_AZURE_AUTH=cli).
      - name: Azure login
        if: env.DUCKY_SIGN_PROVIDER == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - uses: nuget/setup-nuget@v2
        if: env.DUCKY_SIGN_PROVIDER == 'azure'

      - name: Artifact Signing client tools (dlib + signtool)
        if: env.DUCKY_SIGN_PROVIDER == 'azure'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "artifact-signing"
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $tools -NonInteractive
          nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $tools -NonInteractive
          $dlib = Get-ChildItem $tools -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $signtool = Get-ChildItem (Join-Path $tools "Microsoft.Windows.SDK.BuildTools") -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dlib -or -not $signtool) { throw "Artifact Signing client tools did not install" }
          "DUCKY_AZURE_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "DUCKY_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # The same three steps a local release runs (publish_app.RELEASE_STEPS).
      - name: Test
        shell: bash
        run: .venv/Scripts/python -u release/publish_app.py --phase test

      - name: Build and sign Setup
        shell: bash
        env:
          SET_VERSION: ${{ inputs.set_version }}
        run: |
          extra=()
          if [ -n "${SET_VERSION}" ]; then extra+=(--set-version "${SET_VERSION}"); fi
          .venv/Scripts/python -u release/publish_app.py --phase build "${extra[@]}"

      - name: Windows and Linux are the same version
        shell: bash
        env:
          LINUX_VERSION: ${{ needs.linux-version.outputs.version }}
        run: |
          built="$(.venv/Scripts/python -c "import sys; sys.path.insert(0, 'release'); import publish_app as p; print(p.read_version())")"
          if [ "$built" != "$LINUX_VERSION" ]; then
            echo "Windows built $built but Linux built $LINUX_VERSION (the Store moved?): re-run the release."
            exit 1
          fi

      # publish_app's upload step registers dist/linux and publishes dist/linux-repo.
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-dist-*
          path: dist/linux
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-repo
          path: dist/linux-repo

      - name: Dry run (uploads nothing)
        if: inputs.dry_run
        shell: bash
        run: |
          ls -la dist/*.exe dist/linux
          find dist/linux-repo -type f | sort
          .venv/Scripts/python -c "import sys; sys.path.insert(0, 'release'); import publish_app as p; v = p.read_version(); print([(a['os'], a['arch'], a['package'], a['path'].name, a['sig'] and a['sig'].name) for a in p.linux_artifacts(v)]); print(sorted(p.linux_repo_files()))"

      - name: Upload to the Store
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          CHANNEL: ${{ inputs.channel || 'beta' }}
        run: |
          extra=(--channel "${CHANNEL}")
          if [ -n "${NOTES}" ]; then extra+=(--notes "${NOTES}"); fi
          .venv/Scripts/python -u release/publish_app.py --phase upload --notes-from-git "${extra[@]}"

  # After a stable release is live (beta skips it): the AUR package and the Flathub manifest point at the new
  # AppImages (uefnducky.org/downloads/linux/…) with their sha256. A dry run prints both
  # diffs and pushes nothing; a release without AUR_SSH_PRIVATE_KEY / FLATHUB_TOKEN skips that
  # one with a warning before doing any work, so missing accounts never fail the release.
  linux-bumps:
    name: AUR + Flathub bumps
    needs: [publish]
    if: ${{ !cancelled() && inputs.channel == 'stable' && (inputs.mode == 'linux-bumps' || (inputs.mode == 'release' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-22.04
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-dist-*
          path: dist/linux
          merge-multiple: true
          run-id: ${{ inputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Checksums
        run: |
          VERSION="$(basename dist/linux/UEFN-Ducky-*-x86_64.AppImage | sed -E 's/^UEFN-Ducky-(.+)-x86_64\.AppImage$/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA_X86_64=$(sha256sum dist/linux/UEFN-Ducky-$VERSION-x86_64.AppImage | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SHA_AARCH64=$(sha256sum dist/linux/UEFN-Ducky-$VERSION-aarch64.AppImage | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: AUR (uefn-ducky-bin)
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ] && [ "$DRY_RUN" != "true" ]; then echo "::warning::no AUR_SSH_PRIVATE_KEY secret: AUR not bumped"; exit 0; fi
          out="$RUNNER_TEMP/aur"
          mkdir -p "$out"
          for f in PKGBUILD .SRCINFO; do
            sed -E -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" \
              -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$SHA_X86_64')/" \
              -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$SHA_AARCH64')/" \
              -e "s/^(\tpkgver = ).*/\1$VERSION/" -e "s/^(\tpkgrel = ).*/\11/" \
              -e "s/UEFN-Ducky-[0-9]+\.[0-9]+\.[0-9]+-/UEFN-Ducky-$VERSION-/g" \
              -e "s/^(\tsha256sums_x86_64 = ).*/\1$SHA_X86_64/" \
              -e "s/^(\tsha256sums_aarch64 = ).*/\1$SHA_AARCH64/" \
              "build/linux/aur/$f" > "$out/$f"
            diff -u "build/linux/aur/$f" "$out/$f" || true
          done
          grep -q "pkgver = $VERSION" "$out/.SRCINFO" && grep -q "$SHA_X86_64" "$out/.SRCINFO"
          if [ "$DRY_RUN" = "true" ]; then echo "dry run: AUR not pushed"; exit 0; fi
          install -m700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/uefn-ducky-bin.git "$RUNNER_TEMP/aur-repo"
          cp "$out/PKGBUILD" "$out/.SRCINFO" "$RUNNER_TEMP/aur-repo/"
          cd "$RUNNER_TEMP/aur-repo"
          git -c user.name="UEFN Ducky" -c user.email="noreply@uefnducky.org" commit -am "Update to $VERSION" || exit 0
          git push origin HEAD:master

      - name: Flathub (online.uefnducky.Ducky)
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          if [ -z "$FLATHUB_TOKEN" ] && [ "$DRY_RUN" != "true" ]; then echo "::warning::no FLATHUB_TOKEN secret: Flathub not bumped"; exit 0; fi
          python -m pip install pyyaml
          out="$RUNNER_TEMP/flathub"
          mkdir -p "$out"
          if [ "$DRY_RUN" != "true" ] && [ -n "$FLATHUB_TOKEN" ]; then
            gh repo clone flathub/online.uefnducky.Ducky "$out" -- --depth 1
          fi
          cp -f "$out/online.uefnducky.Ducky.yml" "$RUNNER_TEMP/flathub-before.yml" 2>/dev/null || : > "$RUNNER_TEMP/flathub-before.yml"
          # Flathub builds from released files: the local uefn-ducky.tar becomes the AppImage
          # of each arch (url + sha256), extracted to the same bundle/ folder; the repo's
          # other files are copied beside the manifest.
          python - "$out" <<'PY'
          import os, shutil, sys
          from pathlib import Path
          import yaml
          out, src = Path(sys.argv[1]), Path("build/linux/flatpak")
          v, base = os.environ["VERSION"], "https://uefnducky.org/downloads/linux"
          doc = yaml.safe_load((src / "online.uefnducky.Ducky.yml").read_text())
          mod = next(m for m in doc["modules"] if isinstance(m, dict) and m.get("name") == "uefn-ducky")
          sources = []
          for s in mod["sources"]:
              if s.get("path") == "uefn-ducky.tar":
                  for arch, sha in (("x86_64", os.environ["SHA_X86_64"]), ("aarch64", os.environ["SHA_AARCH64"])):
                      sources.append({"type": "file", "url": f"{base}/UEFN-Ducky-{v}-{arch}.AppImage",
                                      "sha256": sha, "dest-filename": "uefn-ducky.AppImage", "only-arches": [arch]})
                  continue
              p = (src / s["path"]).resolve()
              (shutil.copytree(p, out / p.name, dirs_exist_ok=True) if p.is_dir() else shutil.copy(p, out / p.name))
              sources.append({**s, "path": p.name})
          mod["sources"] = sources
          mod["build-commands"] = ["chmod +x uefn-ducky.AppImage", "./uefn-ducky.AppImage --appimage-extract >/dev/null",
                                   "mv squashfs-root/usr/bin bundle", *mod["build-commands"]]
          (out / "online.uefnducky.Ducky.yml").write_text(yaml.safe_dump(doc, sort_keys=False))
          PY
          diff -u "$RUNNER_TEMP/flathub-before.yml" "$out/online.uefnducky.Ducky.yml" || true
          if [ "$DRY_RUN" = "true" ]; then echo "dry run: Flathub PR not opened"; exit 0; fi
          cd "$out"
          git checkout -b "update-$VERSION"
          git add -A
          git -c user.name="UEFN Ducky" -c user.email="noreply@uefnducky.org" commit -m "Update to $VERSION" || exit 0
          git push origin "update-$VERSION"
          gh pr create --repo flathub/online.uefnducky.Ducky --title "Update to $VERSION" \
            --body "UEFN Ducky $VERSION (released from UEFN-Ducky store-publish)."
