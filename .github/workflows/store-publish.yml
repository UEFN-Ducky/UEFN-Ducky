# Manual Store app publish (Setup.exe). Never on push / PR / cron.
# Open-source PRs never get DUCKYOS_API_KEY. Fork workflows cannot publish.
# Environment store-publish requires UEFN-Ducky/officers approval — Write
# maintainers can merge PRs but cannot finish a Store publish without an officer.
# Officers may Run this workflow from main. They cannot merge edits to this file
# (CODEOWNERS @UEFN-Ducky/admins + required code-owner review). Secrets inject
# only after officers approval, and only for the main branch.
#
# Same release as a local one: the three release/publish_app.py steps
# (RELEASE_STEPS in that file) test, build + sign (app EXEs, Inno engine and its
# uninstaller, Ducky Setup host) and upload. Signing runs inside publish_app
# through release/sign_windows.py, with Azure Artifact Signing when the Azure
# secrets are set; without them the release is unsigned (plain Inno Setup).
name: Ducky Plugin Library Publish

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Store release notes (in-app toast); blank = from the commits"
        required: false
        default: ""
        type: string
      set_version:
        description: "Optional exact semver (else patch bump)"
        required: false
        default: ""
        type: string

concurrency:
  group: store-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: build, sign and publish Setup
    runs-on: windows-latest
    timeout-minutes: 120
    environment: store-publish
    env:
      DUCKYOS_API_KEY: ${{ secrets.DUCKYOS_API_KEY }}
      DUCKYOS_BASE_URL: ${{ secrets.DUCKYOS_BASE_URL }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Builds the Ducky Setup host; the Artifact Signing dlib runs on its runtime.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Python venv, panel packages and Inno Setup 6
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller
          (cd ducky_app/frontend/ui_web/web && npm ci --no-audit --no-fund)
          choco install innosetup --no-progress -y

      - name: Require Store API key
        shell: bash
        run: |
          if [ -z "${DUCKYOS_API_KEY}" ]; then
            echo "Missing DUCKYOS_API_KEY (environment secret store-publish)."
            exit 1
          fi
          if [ -z "${DUCKYOS_BASE_URL}" ]; then
            echo "DUCKYOS_BASE_URL=https://uefnducky.org" >> "$GITHUB_ENV"
          fi

      - name: Sign with Artifact Signing when its secrets are set
        shell: bash
        run: |
          if [ -n "${AZURE_CLIENT_ID}" ] && [ -n "${AZURE_TENANT_ID}" ] \
            && [ -n "${AZURE_TRUSTED_SIGNING_ENDPOINT}" ] && [ -n "${AZURE_TRUSTED_SIGNING_ACCOUNT}" ] \
            && [ -n "${AZURE_CERT_PROFILE_NAME}" ]; then
            echo "DUCKY_SIGN_PROVIDER=azure" >> "$GITHUB_ENV"
            echo "DUCKY_AZURE_AUTH=cli" >> "$GITHUB_ENV"
            echo "Signing with Azure Artifact Signing."
          else
            echo "DUCKY_SIGN_PROVIDER=none" >> "$GITHUB_ENV"
            echo "Azure Artifact Signing secrets are not set: this release ships unsigned (plain Inno Setup)."
          fi

      # OIDC sign-in of the Azure CLI; the dlib signs as that identity (DUCKY_AZURE_AUTH=cli).
      - name: Azure login
        if: env.DUCKY_SIGN_PROVIDER == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - uses: nuget/setup-nuget@v2
        if: env.DUCKY_SIGN_PROVIDER == 'azure'

      - name: Artifact Signing client tools (dlib + signtool)
        if: env.DUCKY_SIGN_PROVIDER == 'azure'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "artifact-signing"
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $tools -NonInteractive
          nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $tools -NonInteractive
          $dlib = Get-ChildItem $tools -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $signtool = Get-ChildItem (Join-Path $tools "Microsoft.Windows.SDK.BuildTools") -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dlib -or -not $signtool) { throw "Artifact Signing client tools did not install" }
          "DUCKY_AZURE_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "DUCKY_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # The same three steps a local release runs (publish_app.RELEASE_STEPS).
      - name: Test
        shell: bash
        run: .venv/Scripts/python -u release/publish_app.py --phase test

      - name: Build and sign Setup
        shell: bash
        env:
          SET_VERSION: ${{ inputs.set_version }}
        run: |
          extra=()
          if [ -n "${SET_VERSION}" ]; then extra+=(--set-version "${SET_VERSION}"); fi
          .venv/Scripts/python -u release/publish_app.py --phase build "${extra[@]}"

      - name: Upload to the Store
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          extra=()
          if [ -n "${NOTES}" ]; then extra+=(--notes "${NOTES}"); fi
          .venv/Scripts/python -u release/publish_app.py --phase upload --notes-from-git "${extra[@]}"
