# See the Mac app from Windows: nobody has a Mac, so this run starts "UEFN Ducky.app" in the
# runner's logged-in GUI session, screenshots it every 10 s and collects its logs, boot.json
# and crash reports as artifact macos-look-<arch>.
#   gh workflow run macos-look.yml -f arch=arm64
#   gh run watch
#   gh run download -n macos-look-arm64      (then view the PNGs)
# ref blank = the latest green macos-app artifact; ref set = a fresh build of that ref.
# TCC prompts (mic, Screen Recording) can't be clicked here; the screenshots show their text.
name: macos-look

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/sha to build; blank = latest uefn-ducky-macos-<arch> artifact from macos-app"
        required: false
        default: ""
        type: string
      arch:
        description: "Apple Silicon (arm64) or Intel (x64)"
        required: false
        default: arm64
        type: choice
        options: [arm64, x64]
      script:
        description: "Optional: app arguments (starting with --, e.g. --runtime-smoke smoke.json) or JS for the panel (saved as look-script.js, path in DUCKY_LOOK_SCRIPT)"
        required: false
        default: ""
        type: string
      seconds:
        description: "How long the app runs before it is stopped"
        required: false
        default: "40"
        type: string
      mode:
        description: "look = start + screenshots; remote-uefn = signed in (DUCKY_TEST_ACCOUNT_TOKEN), script drives the linked PC; tcc = denied run, then TCC grants and a granted run; telemetry = usage to staging (DUCKYOS_STAGING_URL)"
        required: false
        default: look
        type: choice
        options: [look, remote-uefn, tcc, telemetry]

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  # A runner is never a user: usage_stats skips sending. Only the telemetry input lifts it (staging).
  DUCKY_SANDBOX: "1"

jobs:
  look:
    name: ${{ inputs.mode }} (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Latest macos-app artifact
        if: inputs.ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow macos-app.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')"
          [ -n "$run" ] || { echo "no green macos-app run: dispatch with ref=main to build"; exit 1; }
          echo "macos-app run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "uefn-ducky-macos-${{ inputs.arch }}" -D dist
          tar -C dist -xf dist/uefn-ducky-macos.tar

      - uses: actions/setup-python@v5
        if: inputs.ref != ''
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        if: inputs.ref != ''
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.ref != ''
      - name: Build ${{ inputs.ref }}
        if: inputs.ref != ''
        run: |
          brew install portaudio ripgrep
          python -m pip install -r requirements-dev.txt
          npm ci --prefix ducky_app/frontend/ui_web/web
          python - <<'EOF'
          import json
          from pathlib import Path
          stand_ins = {
              "verse.tmGrammar.json": {"scopeName": "source.verse", "patterns": [], "repository": {}},
              "language-configuration.json": {},
              "verse-snippets.json": {},
              "verse-dark.tmTheme.json": {"name": "Verse Dark", "type": "dark", "colors": {}, "tokenColors": []},
          }
          lang = Path("ducky_app/frontend/ui_web/web/src/verse-editor/lang")
          lang.mkdir(parents=True, exist_ok=True)
          for name, doc in stand_ins.items():
              if not (lang / name).is_file():
                  (lang / name).write_text(json.dumps(doc), encoding="utf-8")
          EOF
          python build/build_exes.py --no-bump
          codesign --force --deep -s - "dist/UEFN Ducky.app"

      - name: Start, wait and screenshot
        env:
          SCRIPT: ${{ inputs.script }}
          SECONDS_TO_RUN: ${{ inputs.seconds }}
          MODE: ${{ inputs.mode }}
          ARCH: ${{ inputs.arch }}
          STAGING_URL: ${{ secrets.DUCKYOS_STAGING_URL }}
          DUCKY_TEST_ACCOUNT_TOKEN: ${{ secrets.DUCKY_TEST_ACCOUNT_TOKEN }}
        run: |
          out="$PWD/look"
          mkdir -p "$out"
          bin="dist/UEFN Ducky.app/Contents/MacOS/UEFN-Ducky"
          xattr -cr "dist/UEFN Ducky.app" || true
          args=()
          case "$SCRIPT" in
            --*) read -r -a args <<< "$SCRIPT" ;;
            "") ;;
            *) printf '%s' "$SCRIPT" > "$out/look-script.js"; export DUCKY_LOOK_SCRIPT="$out/look-script.js" ;;
          esac
          # run_app <tag>: start the app, screenshot every 10 s for SECONDS_TO_RUN, stop it.
          APP_EXITED=0
          run_app() {
            "$bin" "${args[@]}" > "$out/stdout-$1.log" 2>&1 &
            local pid=$! t total="${SECONDS_TO_RUN:-40}"
            for ((t = 10; t <= total; t += 10)); do
              sleep 10
              screencapture -x "$out/$1-$ARCH-$(printf '%03d' "$t")s.png" || echo "screencapture failed at ${t}s"
              kill -0 "$pid" 2>/dev/null || { echo "app exited after ~${t}s"; APP_EXITED=1; break; }
            done
            kill "$pid" 2>/dev/null || true
            sleep 3
            kill -9 "$pid" 2>/dev/null || true
          }
          case "$MODE" in
            telemetry)
              # The only mode that sends usage, and only to the staging Store.
              [ -n "$STAGING_URL" ] || { echo "telemetry needs the DUCKYOS_STAGING_URL secret (never production)"; exit 1; }
              unset DUCKY_SANDBOX
              export DUCKYOS_BASE_URL="$STAGING_URL"
              # Guard: the URL this profile resolves (account + usage) must be staging, never production.
              "$bin" --base-url-probe "$out/base-url.txt" || { echo "--base-url-probe failed"; exit 1; }
              want="$(python3 -c 'import sys, urllib.parse as u; t = sys.argv[1].strip().rstrip("/"); t = t if "://" in t else "https://" + t; print("https://" + u.urlparse(t).netloc)' "$STAGING_URL")"
              got="$(tr -d '\n' < "$out/base-url.txt")"
              [ "$got" = "$want" ] || { echo "::error::the app resolves its Store to a URL that isn't DUCKYOS_STAGING_URL: telemetry not run"; exit 1; }
              run_app telemetry
              grep -rhi "usage" "$out"/stdout-telemetry.log ~/Library/Logs/UEFN-Ducky 2>/dev/null | tail -n 20 || true
              ;;
            remote-uefn)
              if [ -z "$DUCKY_TEST_ACCOUNT_TOKEN" ]; then
                echo "::notice::no DUCKY_TEST_ACCOUNT_TOKEN secret: remote-uefn skipped"
                run_app look
              else
                # The token signs the test account in; `script` drives the panel to the linked
                # PC's remote Ducky window (ping, a Verse build, take_high_res_screenshot).
                run_app remote-uefn
                grep -rq "Open " "$out"/stdout-remote-uefn.log ~/Library/Logs/UEFN-Ducky 2>/dev/null \
                  || { echo "no 'Open <PC>' hand-off in the logs"; exit 1; }
              fi
              ;;
            tcc)
              # tcc_set <auth_value>: 0 denied, 2 allowed, for mic, Screen Recording and Automation
              # (System Events), so neither run waits on a prompt nobody can click.
              tcc_set() {
                local now svc row
                now="$(date +%s)"
                for svc in kTCCServiceMicrophone kTCCServiceScreenCapture kTCCServiceAppleEvents; do
                  if [ "$svc" = kTCCServiceAppleEvents ]; then
                    row="'$svc','online.uefnducky.Ducky',0,$1,4,1,NULL,NULL,0,'com.apple.systemevents',NULL,0,$now,NULL,NULL,'UNUSED',0"
                  else
                    row="'$svc','online.uefnducky.Ducky',0,$1,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',0"
                  fi
                  sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES($row);" \
                    || echo "::warning::user TCC.db insert for $svc failed"
                  sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "INSERT OR REPLACE INTO access VALUES($row);" \
                    || echo "::warning::system TCC.db insert for $svc failed"
                done
                sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
                  "SELECT service, client, auth_value FROM access WHERE client='online.uefnducky.Ducky';" | tee "$out/tcc-$2.txt"
              }
              # tcc_probe <denied|granted>: launched by LaunchServices so macOS asks about the .app
              # itself (a child of this shell would be judged as the runner), then checked.
              tcc_probe() {
                rm -f "$out/tcc-$1.json"
                open -W -n --env DUCKY_SANDBOX=1 "dist/UEFN Ducky.app" --args --tcc-probe "$out/tcc-$1.json" \
                  || echo "::warning::open -W exited non-zero"
                [ -s "$out/tcc-$1.json" ] || { echo "::error::--tcc-probe wrote no report ($1): the app died"; exit 1; }
                cat "$out/tcc-$1.json"
                python3 - "$out/tcc-$1.json" "$1" "$MIC_UNTESTABLE" <<'EOF'
          import json, sys
          report, run, mic_why = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3]
          bad, seen = [], []
          for name in ("snip", "osascript", "mic"):
              got = report.get(name) or {}
              message = "Privacy & Security" in str(got.get("message", ""))
              if run == "denied" and message:
                  seen.append(f"{name} msg ✓")
              elif run == "denied" and name == "mic" and mic_why:
                  # The runner image lets every app use the mic (or has none): a denial can't show.
                  seen.append(f"mic: {mic_why}, denial not testable (skipped)")
              elif run == "denied":
                  bad.append(f"{name}: no System Settings > Privacy & Security message ({got})")
              elif message:
                  bad.append(f"{name}: still refused after the grant ({got['message']})")
              elif name == "mic" and not (got.get("ok") and float(got.get("seconds") or 0) >= 0.9):
                  bad.append(f"mic: no 1.0 s capture after the grant ({got})")
              elif not got.get("ok"):
                  print(f"::warning::{name}: {got.get('error')}")
          if run == "denied":
              print("denied: " + " ".join(seen))
          else:
              print("granted: mic {} s, snip {}, osascript {}".format(
                  report.get("mic", {}).get("seconds", "-"), report.get("snip", {}).get("size", "-"),
                  "ok" if report.get("osascript", {}).get("ok") else "-"))
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          EOF
              }
              # Read before tcc_set writes anything: a mic the image already allows (for this app or
              # any client) or no input device at all means the mic denial can't be seen here.
              MIC_UNTESTABLE=""
              pre="$( { sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
                        "SELECT client FROM access WHERE service='kTCCServiceMicrophone' AND auth_value=2;"
                      sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                        "SELECT client FROM access WHERE service='kTCCServiceMicrophone' AND auth_value=2;"; } 2>/dev/null \
                    | sort -u | tr '\n' ' ')"
              [ -n "$pre" ] && MIC_UNTESTABLE="runner pre-granted" && echo "mic allowed on the image for: $pre"
              system_profiler SPAudioDataType 2>/dev/null | grep -q "Input Channels" \
                || MIC_UNTESTABLE="${MIC_UNTESTABLE:-runner has no audio input}"
              [ -z "$MIC_UNTESTABLE" ] || echo "mic: $MIC_UNTESTABLE, denial not testable"
              tcc_set 0 denied
              tcc_probe denied | tee "$out/tcc-denied-summary.txt"
              [ "${PIPESTATUS[0]}" = 0 ] || exit 1
              run_app tcc-denied
              [ "$APP_EXITED" = 0 ] || { echo "::error::the app stopped during the denied run"; exit 1; }
              tcc_set 2 granted
              tcc_probe granted | tee "$out/tcc-granted-summary.txt"
              [ "${PIPESTATUS[0]}" = 0 ] || exit 1
              run_app tcc-granted
              ;;
            *)
              run_app look
              ;;
          esac
          ls -la "$out"
          ls "$out"/*.png >/dev/null 2>&1 || { echo "no screenshot taken"; exit 1; }

      - name: Collect logs, boot.json and crash reports
        if: ${{ always() }}
        run: |
          out="$PWD/look"
          mkdir -p "$out/logs" "$out/crash" "$out/boot"
          cp -R ~/Library/Logs/UEFN-Ducky/. "$out/logs/" 2>/dev/null || echo "no ~/Library/Logs/UEFN-Ducky"
          find ~/Library/Logs ~/Library/Application\ Support -name boot.json -path '*UEFN*' 2>/dev/null | while read -r f; do
            cp "$f" "$out/boot/$(echo "$f" | tr '/ ' '__')"
          done
          find ~/Library/Logs/DiagnosticReports -newer "$GITHUB_EVENT_PATH" \( -iname '*UEFN*' -o -iname '*python*' \) 2>/dev/null \
            -exec cp {} "$out/crash/" \;
          find "$out" -type f | sort

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-look-${{ inputs.arch }}
          path: look/
          if-no-files-found: error
          retention-days: 7
