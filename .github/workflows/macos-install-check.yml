# A clean Mac for every install check: a fresh GitHub runner (Apple Silicon macos-26, Intel
# macos-15-intel) installs the released DMG like a user, updates N-1 -> N in place and rolls
# back from a broken update. Nobody has a Mac; run it from Windows:
#   gh workflow run macos-install-check.yml -f job=install
#   gh workflow run store-publish.yml -f mode=macos-packages -f set_version=99.0.0   # N, built not uploaded
#   gh workflow run macos-install-check.yml -f job=update -f from_version=<feed's current> -f new_run=<that run id>
#   gh workflow run macos-install-check.yml -f job=rollback -f from_version=<feed's current>
# from_dmg_arm64 / from_dmg_x64 (Store file ids) start from an older release than the feed's.
#   gh run watch && gh run download -n macos-install-arm64
name: macos-install-check

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Store feed to install from"
        required: false
        default: stable
        type: choice
        options: [stable, beta]
      job:
        description: "Which check"
        required: false
        default: all
        type: choice
        options: [install, update, rollback, all]
      from_version:
        description: "update/rollback: the N-1 version to start from"
        required: false
        default: ""
        type: string
      from_dmg_arm64:
        description: "N-1 arm64 DMG Store file id (empty: N-1 is the feed's current release)"
        required: false
        default: ""
        type: string
      from_dmg_x64:
        description: "N-1 x64 DMG Store file id (empty: N-1 is the feed's current release)"
        required: false
        default: ""
        type: string
      new_run:
        description: "update: the store-publish mode=macos-packages run whose macos-dist-* is N"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read  # the update job downloads N from another run

env:
  PYTHONUTF8: "1"
  # A runner is never a user: usage_stats skips sending in a test copy.
  DUCKY_SANDBOX: "1"
  CHANNEL: ${{ inputs.channel }}
  FROM_VERSION: ${{ inputs.from_version }}

jobs:
  install:
    name: install (${{ matrix.arch }})
    if: inputs.job == 'install' || inputs.job == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      # The row updater.pick_asset takes on this Mac: os=macos, arch=<chip>, package=dmg.
      - name: Fetch the DMG from the Store release feed
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, urllib.request
          base = "https://uefnducky.org"
          url = f"{base}/api/v1/plugins/uefn-ducky-store/collect/app-version"
          if os.environ["CHANNEL"] == "beta":
              url += "?channel=beta"  # ponytail: beta records have no client feed yet
          # The Store answers 403 without the app's Origin + User-Agent (Python's default UA is refused).
          ua = {"User-Agent": "UEFN-Ducky/install-check"}
          req = urllib.request.Request(url, data=b"{}", headers={"Content-Type": "application/json", "Origin": base, **ua})
          doc = json.load(urllib.request.urlopen(req, timeout=30))
          payload = doc.get("payload", doc)
          want = ("macos", os.environ["ARCH"], "dmg")
          row = next((r for r in payload.get("assets") or [] if (r.get("os"), r.get("arch"), r.get("package")) == want), None)
          assert row, f"no {want} row in the feed (version {payload.get('currentVersion')})"
          link = row["url"] if row["url"].startswith("https://") else base + row["url"]
          data = urllib.request.urlopen(urllib.request.Request(link, headers=ua), timeout=900).read()
          got = hashlib.sha256(data).hexdigest()
          assert got == str(row["sha256"]).lower(), f"sha256 {got} != {row['sha256']}"
          open("ducky.dmg", "wb").write(data)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VERSION={payload.get('currentVersion')}\n")
          print("fetched", link, len(data), "bytes, sha256 ok")
          EOF
      - name: Install like a browser download (quarantine, Gatekeeper)
        run: |
          xattr -w com.apple.quarantine "0081;$(date +%s);Safari;" ducky.dmg
          hdiutil attach -nobrowse -mountpoint /Volumes/ducky ducky.dmg
          cp -R "/Volumes/ducky/UEFN Ducky.app" /Applications/
          hdiutil detach /Volumes/ducky
          app="/Applications/UEFN Ducky.app"
          xattr -w com.apple.quarantine "0081;$(date +%s);Safari;" "$app"
          if codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            # Gatekeeper must refuse an ad-hoc app; "Open Anyway" lifts the quarantine.
            if spctl -a -t exec -vv "$app"; then echo "Gatekeeper accepted an ad-hoc app"; exit 1; fi
            xattr -dr com.apple.quarantine "$app"
            echo "MODE=adhoc, open-anyway" >> "$GITHUB_ENV"
          else
            spctl -a -t exec -vv "$app" 2>&1 | tee spctl.txt
            grep -q "source=Notarized Developer ID" spctl.txt
            echo "MODE=notarized" >> "$GITHUB_ENV"
          fi
      - name: Start (runtime smoke + screenshot)
        run: |
          mkdir -p out
          bin="/Applications/UEFN Ducky.app/Contents/MacOS/UEFN-Ducky"
          "$bin" --runtime-smoke "$PWD/out/smoke.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['ok'] and r['window'], r" out/smoke.json
          "$bin" > out/stdout.log 2>&1 &
          sleep 25
          screencapture -x "out/install-${ARCH}.png" || true
          kill $! 2>/dev/null || true
          echo "install ok ($MODE) $VERSION"
      - name: Logs
        if: ${{ always() }}
        run: |
          mkdir -p out/logs
          cp -R ~/Library/Logs/UEFN-Ducky/. out/logs/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -iname '*UEFN*' -exec cp {} out/logs/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-install-${{ matrix.arch }}
          path: out/
          retention-days: 7

  # Both jobs press the app's own Restart (--update-probe with DUCKY_UPDATE_APPLY=1, from
  # 1.2.534 on) against a loopback feed (serve_test_feed.py), so the real download, verify,
  # swap and watchdog run; only the feed is local.
  update:
    name: update (${{ matrix.arch }})
    if: inputs.job == 'update' || inputs.job == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      FROM_DMG: ${{ matrix.arch == 'arm64' && inputs.from_dmg_arm64 || inputs.from_dmg_x64 }}
      NEW_RUN: ${{ inputs.new_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Install N-1 into ~/Applications
        run: |
          [ -n "$NEW_RUN" ] || { echo "update needs new_run: a store-publish mode=macos-packages run (set_version above N-1)"; exit 1; }
          python3 build/macos/fetch_old_dmg.py
          hdiutil attach -nobrowse -mountpoint /Volumes/ducky old.dmg
          mkdir -p ~/Applications && cp -R "/Volumes/ducky/UEFN Ducky.app" ~/Applications/
          hdiutil detach /Volumes/ducky
          xattr -dr com.apple.quarantine ~/Applications/"UEFN Ducky.app" || true
      # N: a real build at a newer version, made by store-publish and never uploaded.
      - uses: actions/download-artifact@v4
        with:
          name: macos-dist-${{ matrix.arch }}
          path: newdist
          run-id: ${{ inputs.new_run }}
          github-token: ${{ github.token }}
      - name: Update to N in place
        run: |
          zip="$(ls newdist/uefn-ducky-update-*-macos-"$ARCH".zip)"
          NEW="$(basename "$zip" | sed -E "s/^uefn-ducky-update-(.+)-macos-$ARCH\.zip$/\1/")"
          python3 build/macos/serve_test_feed.py newdist "$NEW" "$ARCH" &
          sleep 2
          export DUCKY_UPDATE_BASE_URL=http://127.0.0.1:8765
          bin=~/Applications/"UEFN Ducky.app/Contents/MacOS/UEFN-Ducky"
          mkdir -p out
          DUCKY_UPDATE_APPLY=1 "$bin" --update-probe out/apply.json
          # The watchdog starts N and keeps it once its page started (updater.HEALTHY_WITHIN_S = 60).
          sleep 100
          "$bin" --update-probe out/status.json
          python3 - "$FROM_VERSION" "$NEW" out/status.json <<'EOF'
          import json, sys
          old, new, path = sys.argv[1:4]
          r = json.load(open(path))
          assert not r["last_failure"], f"the update was rolled back: {r['last_failure']}"
          assert r["local_version"] == new, f"after the update this copy is {r['local_version']}, not {new}: {r}"
          print(f"update {old} -> {new} ok")
          EOF
      - name: Logs
        if: ${{ always() }}
        run: |
          mkdir -p out/logs
          cp -R ~/Library/Logs/UEFN-Ducky/. out/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-update-${{ matrix.arch }}
          path: out/
          retention-days: 7

  rollback:
    name: rollback (${{ matrix.arch }})
    if: inputs.job == 'rollback' || inputs.job == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      FROM_DMG: ${{ matrix.arch == 'arm64' && inputs.from_dmg_arm64 || inputs.from_dmg_x64 }}
    steps:
      - uses: actions/checkout@v5
      - name: Install N-1 into ~/Applications
        run: |
          python3 build/macos/fetch_old_dmg.py
          hdiutil attach -nobrowse -mountpoint /Volumes/ducky old.dmg
          mkdir -p ~/Applications && cp -R "/Volumes/ducky/UEFN Ducky.app" ~/Applications/
          hdiutil detach /Volumes/ducky
          xattr -dr com.apple.quarantine ~/Applications/"UEFN Ducky.app" || true
      # A broken N: the signature verifies, the app exits 1 at once.
      - name: Broken update, rollback
        run: |
          mkdir -p feed out
          cp -R ~/Applications/"UEFN Ducky.app" "feed/UEFN Ducky.app"
          broken="feed/UEFN Ducky.app/Contents/MacOS/UEFN-Ducky"
          printf '#!/bin/sh\nexit 1\n' > "$broken" && chmod +x "$broken"
          plutil -replace CFBundleShortVersionString -string 99.0.0 "feed/UEFN Ducky.app/Contents/Info.plist"
          codesign --force --deep -s - "feed/UEFN Ducky.app"
          ditto -c -k --keepParent "feed/UEFN Ducky.app" "feed/uefn-ducky-update-99.0.0-macos-$ARCH.zip"
          python3 build/macos/serve_test_feed.py feed 99.0.0 "$ARCH" &
          sleep 2
          export DUCKY_UPDATE_BASE_URL=http://127.0.0.1:8765
          bin=~/Applications/"UEFN Ducky.app/Contents/MacOS/UEFN-Ducky"
          DUCKY_UPDATE_APPLY=1 "$bin" --update-probe out/apply.json
          for i in $(seq 1 40); do
            sleep 3
            [ "$(defaults read ~/Applications/"UEFN Ducky.app/Contents/Info.plist" CFBundleShortVersionString)" = 99.0.0 ] || break
          done
          sleep 5
          "$bin" --update-probe out/status.json
          python3 - "$FROM_VERSION" out/status.json <<'EOF'
          import json, sys
          old, path = sys.argv[1:3]
          r = json.load(open(path))
          assert r["local_version"] == old, f"after the broken update this copy is {r['local_version']}, not {old}: {r}"
          assert r["last_failure"], f"no last_failure written: {r}"
          print(f"rollback restored {old}")
          EOF
      - name: Logs
        if: ${{ always() }}
        run: |
          mkdir -p out/logs
          cp -R ~/Library/Logs/UEFN-Ducky/. out/logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macos-rollback-${{ matrix.arch }}
          path: out/
          retention-days: 7
