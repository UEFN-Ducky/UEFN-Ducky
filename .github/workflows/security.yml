# Daily / PR secret+dep check for UEFN-Ducky (the EXE).
# Does NOT run on Store publish. store-publish.yml is workflow_dispatch only.
# Never upload artifacts, EXE builds, Store payloads, or credentials.
name: Daily Security Check

on:
  pull_request:
  schedule:
    # Once a day 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI is MIT/free. gitleaks-action@v2 requires a paid/org license key.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks detect --source . --verbose --redact

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit PyPI pins (no git VCS lines, no artifact upload)
        run: |
          python -m pip install --upgrade pip pip-audit
          python - <<'PY'
          from pathlib import Path
          out = Path("${{ runner.temp }}") / "requirements-audit.txt"
          lines = []
          for src in (Path("requirements.txt"), Path("requirements-dev.txt")):
              if not src.is_file():
                  continue
              for line in src.read_text(encoding="utf-8").splitlines():
                  s = line.strip()
                  if not s or s.startswith("#") or s.startswith("-r ") or "git+" in s:
                      continue
                  lines.append(s)
          out.write_text("\n".join(dict.fromkeys(lines)) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
          pip-audit -r "${{ runner.temp }}/requirements-audit.txt"
