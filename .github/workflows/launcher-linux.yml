# The native launcher on Linux: cargo tests, then a release build, on native runners for both arches.
name: launcher-linux
on:
  push:
    branches: [main]
    paths: ["native_launcher/**", "build/app_icon.ico", ".github/workflows/launcher-linux.yml"]
  pull_request:
    paths: ["native_launcher/**"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native_launcher }
      - run: xvfb-run -a native_launcher/linux-build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ducky-Launcher-${{ matrix.target }}
          path: native_launcher/target/${{ matrix.target }}/release/Ducky-Launcher
