<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./OnlineMCPIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>UEFN Ducky</title>
    <link rel="stylesheet" href="/src/theme/styles/critical.css" />
    <!-- Boot splash styles are fully inline so they paint before JS/CSS bundles. -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
        background-color: #0a0a0a;
        color: #ededed;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 0;
        background: #0a0a0a;
        transition: opacity 0.22s ease;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }
      #boot-splash .boot-splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(237, 237, 237, 0.18);
        border-top-color: #ededed;
        border-radius: 50%;
        animation: boot-splash-spin 0.7s linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-label="Loading UEFN Ducky">
      <img src="./OnlineMCPIcon.png" width="72" height="72" alt="" />
      <div class="boot-splash-spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
