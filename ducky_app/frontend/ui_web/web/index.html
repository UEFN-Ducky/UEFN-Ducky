<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./OnlineMCPIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>UEFN Ducky</title>
    <link rel="stylesheet" href="/src/theme/styles/critical.css" />
    <!-- Boot splash styles are fully inline so they paint before JS/CSS bundles. -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
        background-color: #0a0a0a;
        color: #ededed;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 0;
        background: #0a0a0a;
        transition: opacity 0.22s ease;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }
      #boot-splash .boot-splash-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(237, 237, 237, 0.18);
        border-top-color: #ededed;
        border-radius: 50%;
        animation: boot-splash-spin 0.7s linear infinite;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Before the app's script starts, send Ducky whatever stops it (a stuck-launch crash report). -->
    <script>
      window.addEventListener(
        "error",
        function (e) {
          if (window.__duckyStarted || location.protocol !== "http:") return;
          var t = e.target;
          var msg = t && t !== window && (t.src || t.href) ? "Could not load " + (t.src || t.href) : e.message || "Script error";
          fetch("/__panel_boot", { method: "POST", body: JSON.stringify({ error: String(msg).slice(0, 300) }) }).catch(function () {});
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-label="Loading UEFN Ducky">
      <img src="./OnlineMCPIcon.png" width="72" height="72" alt="" />
      <div class="boot-splash-spinner" aria-hidden="true"></div>
    </div>
    <script>
      // The phone panel sits under the site's own Remote View loading screen: no second logo.
      if (/[?&]direct=/.test(location.search)) document.getElementById("boot-splash").classList.add("boot-splash--done");
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
