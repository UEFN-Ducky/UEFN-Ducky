[pytest]
markers =
    real_exit_timers: exercises updater timers that call os._exit; stubs them itself
# Pins rootdir/confcutdir to the repo root so conftest.py (per-test AppData
# isolation, real-AppData guard) loads no matter which directory pytest is run from.
testpaths = ducky_app tests
# A hung test fails after 10 minutes instead of stalling the whole run (Oct 27: a release's
# test step sat for hours on a stuck worker). "thread" works on Windows: it dumps every
# thread's stack, then ends that worker; xdist reports the test and starts a new worker.
timeout = 600
timeout_method = thread
