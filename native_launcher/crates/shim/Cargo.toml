[package]
name = "shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "window.pywebview.api in WebView2: the injected shim.js and the routing between native window calls and backend contract calls"

[dependencies]
# preserve_order: page args and backend answers keep their key order, as under pywebview.
# Sorted keys made the page's appearance echo check differ every time, so it re-sent the
# same appearance ~10 times a second and the flood pushed chat events out of the buffer.
serde_json = { version = "1", features = ["preserve_order"] }
