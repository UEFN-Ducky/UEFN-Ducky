[package]
name = "tray"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tray icon, menu and toasts shared with ducky_app/frontend/tray_icon.py"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
