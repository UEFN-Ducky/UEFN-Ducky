[package]
name = "dialogs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native open / save / folder dialogs (IFileOpenDialog, IFileSaveDialog) with pywebview's create_file_dialog arguments and result shapes"

[dependencies]
serde_json = "1"

# The portal backend only (no GTK): the desktop's picker, also inside Flatpak.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
