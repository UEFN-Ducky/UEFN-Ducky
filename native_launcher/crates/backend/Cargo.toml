[package]
name = "backend"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ducky's backend in Rust: answers the paths the launcher's UI server routes to it"

[[bin]]
name = "Ducky-Backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = "1"
# preserve_order: a JSON object keeps its keys in the order Python wrote them.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# bundled: one SQLite on every PC, built with FTS5 and JSON (chat and memory search need them).
rusqlite = { version = "0.37", features = ["bundled"] }
# Sealed rows (store/seal.rs): the Linux/macOS cipher, and the text framing everywhere.
aes-gcm = "0.10"
base64 = "0.22"
# Account ids are a SHA-256 of who is signed in (store/account.rs).
sha2 = "0.10"
# A folder's fingerprint hashes its names as the Python backend does (api/project_files).
md-5 = "0.10"
# Search tokens and payload names are keyed BLAKE2b; words are folded as Python folds
# them (store/tokens.rs).
blake2 = "0.10"
# Large message fields are stored zlib-compressed (store/messages.rs).
flate2 = "1"
caseless = "0.2"
unicode-normalization = "0.1"
# Sealed files (store/sealed_file.rs): the file's key is wrapped for an account's X25519 key.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# Calls to the account's website (api/site.rs). Certificates are checked against the OS
# store, as the Python backend does: a PC whose antivirus re-signs HTTPS still connects.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "macos-system-configuration"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

[dev-dependencies]
supervisor = { path = "../supervisor" }
tokio = { version = "1", features = ["io-util"] }
