[package]
name = "ducky-launcher"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "ducky_launcher"
path = "src/lib.rs"

[[bin]]
name = "Ducky-Launcher"
path = "src/main.rs"

[dependencies]
ducky-instance = { path = "../crates/instance" }
autostart = { path = "../crates/autostart" }
bounds = { path = "../crates/bounds" }
dialogs = { path = "../crates/dialogs" }
report = { path = "../crates/report" }
server = { path = "../crates/server" }
shim = { path = "../crates/shim" }
splash = { path = "../crates/splash" }
supervisor = { path = "../crates/supervisor" }
tray = { path = "../crates/tray" }
window = { path = "../crates/window" }
serde_json = "1"

# The same versions as crates/window, so the EXE links one `windows` crate.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
