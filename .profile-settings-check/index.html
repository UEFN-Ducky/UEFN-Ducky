<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Profile settings check</title>
<style>
:root{--ducky-color-bg:#111;--ducky-color-cardBg:#191919;--ducky-color-sidebarBg:#222;--ducky-color-border:#363636;--ducky-color-text:#f2f2f2;--ducky-color-textMuted:#aaa;--ducky-color-accent:#fbb436;--ducky-color-accentOn:#171717;--ducky-color-surfaceMuted:#222;--ducky-border-width:1px;--ducky-radius-pill:999px;--ducky-radius-input:14px;--ducky-space-sm:8px;--ducky-space-md:12px;--ducky-icon-size:20px;--ducky-motion-durationBounce:0.4s;--ducky-motion-easeBounce:ease}
*{box-sizing:border-box}body{margin:24px;background:var(--ducky-color-bg);color:var(--ducky-color-text);font:16px system-ui}button,input{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.b-user-profile{padding:24px;border:1px solid #444}.user-profile-avatar{display:grid;place-items:center;background:#333}.ducky-modal-backdrop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009}.ducky-modal{background:var(--ducky-color-cardBg);border:1px solid var(--ducky-color-border);border-radius:24px}.ducky-btn{border:1px solid #555;border-radius:12px;padding:10px 16px;color:inherit;background:transparent}.ducky-btn--primary{background:var(--ducky-color-accent);border-color:var(--ducky-color-accent);color:var(--ducky-color-accentOn)}.modal-close{border:0;border-radius:50%;background:#282828;color:inherit}.account-security-body,.account-security__section{display:flex;flex-direction:column}.registry-tabs-indicator{transition:transform .4s ease,width .4s ease}.account-security__danger{display:flex;flex-direction:column}#results{white-space:pre-wrap}body.light{--ducky-color-bg:#f5f5f5;--ducky-color-cardBg:white;--ducky-color-sidebarBg:#eee;--ducky-color-border:#ccc;--ducky-color-text:#161616;--ducky-color-textMuted:#555;--ducky-color-surfaceMuted:#f6f6f6}
html:not(.ud-native-shell) .ud-remote__pc--add{display:none!important}
.ud-remote__pc{border:1px solid #444;border-radius:14px}
</style><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/hero.css"><link rel="stylesheet" href="/panel.css"></head>
<body data-page-path="/profile"><button id="run">Run regression checks</button><button id="theme">Switch light / dark</button><pre id="results">Ready</pre>
<header id="app-header" hidden><div data-ducky-language></div></header>
<main id="app-content"><section class="b-user-profile ducky-card"><div class="user-profile-layout"><button class="user-profile-avatar-btn"><span class="user-profile-avatar">A</span></button><div class="user-profile-details"><span class="user-profile-name-display">Alex Ducky</span></div><div class="user-profile-actions"><form class="user-profile-logout" method="post" action="/logout"><button type="submit" class="user-profile-logout-btn" aria-label="Log out"><span>Log out</span></button></form></div></div><input data-profile-photo type="file" hidden><p data-profile-status hidden></p></section>
<section class="ud-root ud-remote"><ul class="ud-remote__pcs"><li class="ud-remote__pc">Studio PC<button type="button" class="ducky-btn ducky-btn--primary">Open</button></li><li class="ud-remote__pc ud-remote__pc--add" data-ud-add-card hidden><span class="ud-remote__pc-plus">+</span><span class="ud-remote__pc-name">Connect to your UEFN Ducky</span></li></ul></section>
<section class="b-account-security ducky-card is-open"><h3>Security</h3><div class="account-security-body">
<div class="registry-tabs" data-tabs role="tablist"><button type="button" class="registry-tab-btn is-active" data-tab="general" aria-controls="acct-1-general">General</button><button type="button" class="registry-tab-btn" data-tab="signin" aria-controls="acct-1-signin">Sign-in</button><button type="button" class="registry-tab-btn" data-tab="sessions" aria-controls="acct-1-sessions">Sessions</button><span class="registry-tabs-indicator" aria-hidden="true"></span></div>
<div class="ducky-tabs__panel" id="acct-1-general"><section class="account-security__section" data-acct-section="profile"><form class="account-security__form" data-acct-profile><label>Display name<input class="ducky-input" name="displayName" maxlength="120" autocomplete="name" value="Alex Ducky"></label><p class="tm-muted">alex@example.com</p><p class="tm-muted">member</p><button type="submit" class="ducky-btn ducky-btn--primary">Save</button><p class="account-security__status" data-acct-profile-status hidden></p></form></section><section data-acct-section="danger"><div class="account-security__danger"><p class="account-security__danger-title">Permanently delete your account and associated data.</p><button class="ducky-btn" data-acct-delete>Delete account</button></div></section></div>
<div class="ducky-tabs__panel" id="acct-1-signin" hidden>Sign-in options</div><div class="ducky-tabs__panel" id="acct-1-sessions" hidden>Browser sessions</div></div></section></main><div id="ducky-modal-host"></div>
<script>
window.testModalCalls=[];
window.DuckyUI={modal:{open(options){window.testModalCalls.push(options.title);return Promise.resolve(false);}}};
window.duckyosLanguageSwitcherInit=root=>{if(!root.querySelector('.ducky-language-menu'))root.innerHTML='<button class="ducky-language-menu" aria-label="Language">🇺🇸</button>';};
</script>
<script src="/core.js"></script><script src="/hero.js"></script><script src="/panel.js"></script><script src="/check.js"></script>
</body></html>
