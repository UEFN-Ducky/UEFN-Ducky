<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>UEFN Ducky Setup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="glow" aria-hidden="true"></div>

    <div class="win-btns">
      <button class="win-btn" id="btn-min" type="button" title="Minimize" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
      </button>
      <button class="win-btn win-btn--close" id="btn-close" type="button" title="Close" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
      </button>
    </div>

    <section class="screen" data-screen="welcome">
      <div class="brand">
        <img class="logo" src="logo.png" alt="" draggable="false" />
        <h1>UEFN Ducky</h1>
        <p class="tagline">The AI toolkit for Unreal Editor for Fortnite</p>
        <span class="pill" id="welcome-version"></span>
      </div>
      <div class="summary">
        <dl class="summary-list">
          <div class="summary-row"><dt>Install to</dt><dd class="summary-path" id="sum-dir"></dd></div>
          <div class="summary-row"><dt>For</dt><dd id="sum-scope"></dd></div>
        </dl>
        <button class="link-btn" id="change" type="button">Change</button>
      </div>
      <div class="actions">
        <button class="btn btn-primary btn-lg" id="install" type="button">Install</button>
        <p class="fine">By installing, you agree to the <button class="link-btn" id="read-license" type="button">license</button>.</p>
      </div>
    </section>

    <section class="screen screen--form" data-screen="options">
      <header class="screen-head">
        <button class="back-btn" type="button" data-back aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <h2>Install options</h2>
      </header>
      <div class="form">
        <label class="field-label" for="dir">Install location</label>
        <div class="path-row">
          <input id="dir" spellcheck="false" autocomplete="off" />
          <button class="btn btn-secondary" id="browse" type="button">Browse</button>
        </div>
        <p class="hint" id="space"></p>
        <span class="field-label">Who can use it</span>
        <div class="choices" role="radiogroup" aria-label="Who can use it">
          <button class="choice" id="scope-user" type="button" role="radio">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-copy"><strong>Only me</strong><small>No administrator prompt.</small></span>
          </button>
          <button class="choice" id="scope-machine" type="button" role="radio">
            <span class="radio" aria-hidden="true"></span>
            <span class="choice-copy"><strong>Everyone on this PC</strong><small>Windows asks for permission.</small></span>
          </button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="desktop" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Desktop shortcut</span>
        </label>
      </div>
      <div class="actions actions--row">
        <button class="btn btn-secondary" type="button" data-back>Back</button>
        <button class="btn btn-primary" id="options-install" type="button">Install</button>
      </div>
    </section>

    <section class="screen screen--form" data-screen="license">
      <header class="screen-head">
        <button class="back-btn" type="button" data-back aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <h2>License</h2>
      </header>
      <div class="license" id="license-text" tabindex="0"></div>
      <div class="actions actions--row">
        <button class="btn btn-secondary" type="button" data-back id="license-back">Back</button>
      </div>
    </section>

    <section class="screen" data-screen="progress">
      <div class="parade" aria-hidden="true">
        <span class="parade-track">
          <img class="duck duck--leader" src="duckies/Artist.png" alt="" draggable="false" />
          <img class="duck duck--mom" src="duckies/cowboy.png" alt="" draggable="false" />
          <img class="duck duck--boy" src="duckies/hacker.png" alt="" draggable="false" />
          <img class="duck duck--girl" src="duckies/wizard.png" alt="" draggable="false" />
        </span>
      </div>
      <h2 id="progress-title">Installing UEFN Ducky</h2>
      <p class="sub" id="progress-versions"></p>
      <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" id="bar"></div>
        <div class="progress-sweep" aria-hidden="true"></div>
      </div>
      <div class="progress-meta">
        <span id="status">Getting ready…</span>
        <span class="progress-pct" id="percent"></span>
      </div>
      <div class="actions">
        <button class="link-btn link-btn--muted" id="cancel" type="button">Cancel</button>
      </div>
    </section>

    <section class="screen" data-screen="done">
      <div class="badge-wrap">
        <img class="logo" src="logo.png" alt="" draggable="false" />
        <span class="badge badge--ok" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 7.4l2.6 2.6L11 4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </span>
      </div>
      <h2 id="done-title">UEFN Ducky is ready</h2>
      <p class="sub" id="done-sub"></p>
      <div class="actions">
        <button class="btn btn-primary btn-lg" id="open" type="button">Open UEFN Ducky</button>
        <button class="link-btn link-btn--muted" id="close-done" type="button">Close</button>
      </div>
    </section>

    <section class="screen" data-screen="error">
      <div class="badge-wrap">
        <img class="logo logo--dim" src="logo.png" alt="" draggable="false" />
        <span class="badge badge--err" aria-hidden="true">!</span>
      </div>
      <h2 id="error-title">Setup didn't finish</h2>
      <p class="sub sub--error" id="error"></p>
      <div class="actions actions--row">
        <button class="btn btn-secondary" id="close-error" type="button">Close</button>
        <button class="btn btn-primary" id="retry" type="button">Try again</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
